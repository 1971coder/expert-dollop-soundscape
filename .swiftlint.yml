# SwiftLint configuration for AuralFlow.
#
# Ratified by WP00 — Foundation. See docs/coding-standards.md §7.
# Posture: small, defended ruleset. Layout/whitespace is swift-format's job
# (docs/coding-standards.md §8); SwiftLint owns correctness and safety.
#
# Run by ./scripts/check.sh with --strict, so every warning fails the build.
# To add a rule, edit this file rather than disabling inline — the policy
# stays grep-able.

included:
  - Soundscape
  - SoundscapeTests
  - SoundscapeUITests

excluded:
  - .build
  - DerivedData
  - build
  - Pods
  - vendor
  - Soundscape.xcodeproj
  - "**/*.generated.swift"

# Disabled defaults that fight swift-format or are too noisy for an empty repo.
disabled_rules:
  - trailing_whitespace        # swift-format owns whitespace.
  - opening_brace              # swift-format owns brace placement.
  - statement_position         # swift-format owns control-flow layout.
  - vertical_whitespace        # swift-format owns blank lines.
  - line_length                # see explicit override below.
  - todo                       # CLAUDE.md already forbids stray TODOs.

# Correctness / safety rules we actively defend.
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - closure_end_indentation
  - closure_spacing
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_object_literal
  - fallthrough
  - identical_operands
  - joined_default_parameter
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_import
  - yoda_condition

# Tuned thresholds — pragmatic, not absolute.
line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 400
  error: 700

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - hz   # audio constants
    - db   # decibels
    - lr   # left/right
    - lp   # low-pass
    - hp   # high-pass
    - rms

# Custom rules. The audio-thread guard is intentionally a starting point:
# WP01 (Audio Prototype) is expected to tighten it once Soundscape/Audio/
# actually exists.
custom_rules:
  no_print_on_render:
    name: "No print on the audio render thread"
    regex: '^\s*print\('
    match_kinds:
      - identifier
    included: ".*/Audio/.*\\.swift"
    message: "print() is forbidden anywhere in Audio/. Use os.Logger off the render thread; see coding-standards §11."
    severity: error

  no_force_try_in_app:
    name: "No try! in app code"
    regex: '\btry!\s'
    excluded: ".*Tests.*\\.swift"
    message: "try! is forbidden outside tests (coding-standards §5)."
    severity: error

reporter: "xcode"
